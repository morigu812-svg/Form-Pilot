<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormPilot</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="https://apis.google.com/js/api.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>FormPilot</h1>
    <p>自分のGoogleフォームを作成・編集し、受付と回答を管理します。</p>
    <p id="account"></p>
    <button id="connect">Googleで接続</button>
    <button id="disconnect" hidden>ログアウト</button>
    <p id="status" role="status"></p>
    <section id="dashboard" hidden>
      <h2>自分のフォーム <span id="count"></span></h2>
      <form id="create">
        <label>フォーム名 <input name="title" required maxlength="300"></label>
        <button>新規作成</button>
      </form>
      <button id="refresh">一覧を更新</button>
      <button id="import">Driveから取り込む</button>
      <button id="ledger">管理台帳を更新</button>
      <a id="ledger-link" target="_blank" rel="noopener noreferrer" hidden>管理台帳を開く</a>
      <ul id="forms"></ul>
    </section>
    <section id="detail" hidden>
      <h2>フォーム編集</h2>
      <p id="publication"></p>
      <p><a id="native" target="_blank" rel="noopener noreferrer">Google Formsで開く</a>
        <a id="responder" target="_blank" rel="noopener noreferrer" hidden>回答ページを開く</a></p>
      <div class="actions">
        <button id="start">受付開始</button>
        <button id="stop">受付停止</button>
        <button id="unpublish">非公開</button>
        <button id="sharing">リンク公開設定</button>
        <button id="trash">ゴミ箱に移動</button>
      </div>
      <form id="edit">
        <label>タイトル <input id="title" required></label>
        <label>説明 <textarea id="description"></textarea></label>
        <div id="items"></div>
        <button id="add" type="button">質問を追加</button>
        <button>編集を保存</button>
      </form>
      <h3>回答</h3>
      <button id="responses">回答を表示</button>
      <button id="more" hidden>次のページ</button>
      <pre id="answer-list" hidden></pre>
    </section>
  </main>
</body>
</html>
